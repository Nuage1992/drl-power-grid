  <title
     id="title">Illustrative power-flow redistribution before and after substation busbar switching</title>
  <desc
     id="desc">Before switching, all equipment is connected to Busbar 1 and Line C is overloaded at 40 megawatts against a 35 megawatt limit. After Line A and Line B are transferred to Busbar 2, Line C carries 10 megawatts and is no longer overloaded.</desc>
